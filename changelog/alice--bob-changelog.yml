description: >-
  Alice & Bob publishes one changelog, and it covers the qiskit-alice-bob-provider client
  library rather than the Felis Cloud REST API. Entries are keyed by semver release with no
  dates on the page; release dates below are taken from the PyPI upload timestamps for the
  same versions. Breaking changes to the developer surface — including the migration of the
  default API host to api-gcp.alice-bob.com — have only ever been announced here.
