  company conforms to strongly is a domain standard, not a web-API one: circuits are
  submitted in QIR, the QIR Alliance intermediate representation, and the client library is
  built on Qiskit. On the web-API side the surface is a plain FastAPI service — an OpenAPI
  3.1.0 document is published unauthenticated, and essentially nothing else.
