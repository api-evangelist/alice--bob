openapi: 3.2.0
info:
  title: Felis Cloud • API Reference Health API
  summary: '**Run quantum circuits on Alice & Bob''s emulators and real quantum hardware.**'
  description: The Felis Cloud API lets you execute quantum circuits on emulators and real quantum hardware made by Alice & Bob.
  version: 0.1.0
servers:
- url: /external
tags:
- name: Health
paths:
  /v1/health/:
    get:
      summary: Check Health
      description: Return "OK" if the Felis Cloud API is up and running.
      operationId: check_health_v1_health__get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Check Health V1 Health  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Health
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
