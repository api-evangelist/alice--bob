description: >-
  Alice & Bob distributes exactly one first-party client library: the Qiskit provider
  for Felis Cloud, published to PyPI from the Alice-Bob-SW GitHub organization. It is
  both the local emulator package and the remote client for the Felis Cloud REST API —
  the docs describe it as the reference implementation of the API. No first-party
  JavaScript, Go, Java, .NET, Ruby, PHP or Rust client is published; those registries
  were probed and returned no Alice & Bob package.

