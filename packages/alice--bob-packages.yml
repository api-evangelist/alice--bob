    requires_python: '>=3.9,<3.14'
    install: pip install qiskit-alice-bob-provider
    summary: >-
      Provider for running Qiskit circuits on Alice & Bob QPUs and simulators. Ships
      both AliceBobRemoteProvider (calls the Felis Cloud REST API with an API key) and
      AliceBobLocalProvider (local cat-qubit emulators, no account required).
    covers_api: Felis Cloud API

