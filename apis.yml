aid: alice--bob
name: Alice Bob
description: 'Alice & Bob is a quantum computing company headquartered in Paris with
  a presence in Boston, founded in 2020, building a universal fault-tolerant quantum
  computer on cat qubits — superconducting qubits that are intrinsically protected
  against bit-flip errors. Its commercial developer surface is Felis Cloud, a Quantum
  Computing as a Service (QCaaS) product that executes quantum circuits on Boson 4
  cat-qubit QPUs hosted in Alice & Bob''s own premises and on cloud-hosted physical
  and logical qubit emulators. Felis Cloud is reached through a public REST API (jobs,
  targets, availability and health) that accepts circuits in QIR format, and through
  the open-source qiskit-alice-bob-provider Qiskit provider that wraps it.'
